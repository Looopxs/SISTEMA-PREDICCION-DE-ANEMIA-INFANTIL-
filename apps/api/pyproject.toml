[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nutripredict-api"
version = "1.0.0"
description = "NutriPredict AI Scientific Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "greenlet>=3.0.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.1",
    "python-multipart>=0.0.9",
    "pandas>=2.2.0",
    "numpy>=1.26.0,<2.1.0",
    "scipy>=1.13.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.5.0",
    "xgboost>=2.1.0",
    "catboost>=1.2.0",
    "torch>=2.2.0",
    "shap>=0.45.0",
    "reportlab>=4.2.0",
    "openpyxl>=3.1.5",
    "httpx>=0.27.0",
    "pytest>=8.2.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

